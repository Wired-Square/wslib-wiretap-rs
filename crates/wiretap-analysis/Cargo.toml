[package]
name = "wiretap-analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Payload analysis for WireTAP frames: the identification pass that says which bytes are worth solving as a checksum, and the byte-role classifier."
readme = "README.md"

[dependencies]
wiretap-catalog = { path = "../wiretap-catalog" }
wiretap-checksum = { path = "../wiretap-checksum" }
wiretap-decode = { path = "../wiretap-decode" }
wiretap-gateway = { path = "../wiretap-gateway" }
rayon = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
