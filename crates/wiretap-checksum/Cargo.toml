[package]
name = "wiretap-checksum"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Checksum algorithms and a scored detection engine for WireTAP frames: XOR, Sum8, CRC-8/16, candidate sweep, ranking, and translatable notes."
readme = "README.md"

[dependencies]
wiretap-decode = { path = "../wiretap-decode" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
