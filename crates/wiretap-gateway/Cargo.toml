[package]
name = "wiretap-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The WireTAP gateway's HTTP API as serde types: analytical query results, the archive and events endpoints, database activity, health and the database list, the admin API for catalogue assignment, the request bodies and query strings, and the query spec with its SQLite row filter."
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12", optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
serde_json = "1"
