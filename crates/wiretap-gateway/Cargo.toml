[package]
name = "wiretap-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The WireTAP gateway's HTTP API as serde types: analytical query results, the archive and events endpoints, database activity, health and the database list, the admin API for catalogue assignment, and the request bodies and query strings."
